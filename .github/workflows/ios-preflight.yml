name: Prozakon iOS App Store Preflight

on:
  workflow_dispatch:
  push:
    branches: [main, fix-appflow-wrapper-path-20261008]
    paths:
      - 'config.xml'
      - 'package.json'
      - 'package-lock.json'
      - 'www/**'
      - 'scripts/**'
      - 'fastlane/**'
      - '.github/workflows/ios-preflight.yml'

permissions:
  contents: read

jobs:
  verify-ios:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify application source
        shell: bash
        run: |
          set -euo pipefail
          node --check www/js/index.js
          ruby -c fastlane/Gymfile
          grep -Fx 'destination("generic/platform=iOS")' fastlane/Gymfile
          grep -Fx 'xcargs("DEVELOPMENT_TEAM=F2BCHMBHU9")' fastlane/Gymfile
          grep -F 'xcodebuild_command(' fastlane/Gymfile
          ruby <<'RUBY'
          class GymfileCheck
            attr_reader :wrapper_command
            def destination(value)
              raise "Wrong destination: #{value}" unless value == "generic/platform=iOS"
            end
            def xcargs(value)
              raise "Wrong development team: #{value}" unless value == "DEVELOPMENT_TEAM=F2BCHMBHU9"
            end
            def xcodebuild_command(value)
              @wrapper_command = value
            end
          end
          config = GymfileCheck.new
          config.instance_eval(File.read("fastlane/Gymfile"), File.expand_path("fastlane/Gymfile"))
          expected = "bash #{File.expand_path('scripts/appflow-xcodebuild.sh', Dir.pwd)}"
          raise "Wrong Appflow wrapper path: #{config.wrapper_command}" unless config.wrapper_command == expected
          puts "APPFLOW GYMFILE PATH VALID: #{config.wrapper_command}"
          RUBY
          bash -n scripts/appflow-xcodebuild.sh
          echo "FASTLANE IOS DESTINATION CONFIG PASSED"
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const cfg = fs.readFileSync('config.xml', 'utf8');
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const index = fs.readFileSync('www/index.html', 'utf8');
          assert(cfg.includes('version="' + pkg.version + '"'), 'Cordova version');
          assert(pkg.version === lock.version && lock.packages[''].version === pkg.version, 'Version mismatch');
          assert(pkg.devDependencies['cordova-ios'] === '8.1.1', 'iOS version');
          assert(pkg.devDependencies['onesignal-cordova-plugin'] === '5.6.0', 'OneSignal version');
          assert(cfg.includes('name="deployment-target" value="15.0"'), 'iOS minimum version');
          assert(cfg.includes('8c912104-8b46-497f-9ea2-d0cd76def931'), 'OneSignal App ID');
          assert(!index.includes('zlist.html'), 'Missing legacy lawyer screen');
          assert(index.includes('uristpage.html'), 'Lawyer startup route');
          for (const page of ['index','home','login','kurerpage','uristpage']) {
            const html = fs.readFileSync('www/' + page + '.html', 'utf8');
            assert(html.includes('src="js/index.js"'), page + ' missing push initialization');
            assert(html.includes('src="cordova.js"'), page + ' missing cordova runtime');
          }
          const push = fs.readFileSync('www/js/index.js', 'utf8');
          assert(push.includes('oneSignal.initialize(APP_ID)'), 'OneSignal init');
          assert(push.includes('oneSignal.login(String(userId))'), 'OneSignal user mapping');
          assert(push.includes('requestPermission('), 'Notification permission');
          console.log('SOURCE PREFLIGHT PASSED');
          NODE

      - name: Install exact dependencies
        run: |
          npm ci
          npm install -g cordova@latest

      - name: Generate clean native iOS project
        run: |
          cordova platform add ios@8.1.1 --nosave
          cordova prepare ios
          cordova platform ls
          node <<'NODE'
          const fs = require('fs');
          const project = fs.readFileSync('platforms/ios/App.xcodeproj/project.pbxproj', 'utf8');
          const matches = project.match(/SUPPORTED_PLATFORMS = "iphoneos iphonesimulator";/g) || [];
          if (matches.length < 2 || project.includes('SUPPORTS_MACCATALYST = YES')) {
            throw new Error('Non-iOS destinations still enabled in Xcode project');
          }
          const reachability = fs.readFileSync('platforms/ios/App/Plugins/cordova-plugin-network-information/CDVReachability.m', 'utf8');
          if (reachability.includes('#import <netinet6/in6.h>')) {
            throw new Error('Xcode 26 private network header was not removed');
          }
          console.log('APPFLOW PLATFORM HOOK PASSED', matches.length);
          NODE
          xcodebuild -version
          xcodebuild -workspace platforms/ios/App.xcworkspace -scheme App -configuration Release -showdestinations

      - name: Verify Appflow Xcode build wrapper filters only global signing override
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          cat > "$TMP/mock" <<'MOCK'
          #!/usr/bin/env bash
          printf '%s\n' "$@" > "$CLICAID_CAPTURE"
          MOCK
          chmod +x "$TMP/mock"
          export CLICAID_XCODEBUILD_BIN="$TMP/mock"
          CLICAID_CAPTURE="$TMP/archive-args" bash scripts/appflow-xcodebuild.sh \
            -workspace App.xcworkspace -scheme App DEVELOPMENT_TEAM=F2BCHMBHU9 \
            -destination generic/platform=iOS archive \
            'CODE_SIGN_IDENTITY=Apple Distribution: Hrihorii Shevchenko (F2BCHMBHU9)'
          ! grep -q '^CODE_SIGN_IDENTITY=' "$TMP/archive-args"
          grep -qx 'DEVELOPMENT_TEAM=F2BCHMBHU9' "$TMP/archive-args"
          grep -qx 'archive' "$TMP/archive-args"
          grep -qx 'generic/platform=iOS' "$TMP/archive-args"
          CLICAID_CAPTURE="$TMP/non-archive-args" bash scripts/appflow-xcodebuild.sh \
            -showBuildSettings 'CODE_SIGN_IDENTITY=Apple Distribution: Test'
          grep -qx 'CODE_SIGN_IDENTITY=Apple Distribution: Test' "$TMP/non-archive-args"
          echo "APPFLOW SIGNING WRAPPER PASSED"

      - name: Archive for physical iOS devices without signing
        run: |
          set -euo pipefail
          bash scripts/appflow-xcodebuild.sh -workspace platforms/ios/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/Clicaid.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM=F2BCHMBHU9 archive 'CODE_SIGN_IDENTITY=Apple Distribution: Test'

      - name: Check bundle executables and arm64 architectures
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find Clicaid.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          MAIN="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          test "$BUNDLE_ID" = 'mk.clicaid.app'
          test -f "$APP/$MAIN"
          test -f "$APP/www/js/index.js"
          file "$APP/$MAIN"
          lipo -info "$APP/$MAIN"
          lipo -archs "$APP/$MAIN" | grep -qw arm64
          COUNT=0
          while IFS= read -r BUNDLE; do
            [ -f "$BUNDLE/Info.plist" ] || continue
            EXEC="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$BUNDLE/Info.plist" 2>/dev/null || true)"
            [ -n "$EXEC" ] || continue
            BIN="$BUNDLE/$EXEC"
            echo "Inspecting $BIN"
            test -f "$BIN"
            file "$BIN"
            lipo -info "$BIN"
            lipo -archs "$BIN" | grep -qw arm64
            COUNT=$((COUNT+1))
          done < <(find "$APP" -type d \( -name '*.framework' -o -name '*.appex' \))
          echo "Verified $COUNT embedded framework/extension executables."
          echo "### iOS architecture validation passed" >> "$GITHUB_STEP_SUMMARY"
          echo "Main executable: $MAIN (arm64)" >> "$GITHUB_STEP_SUMMARY"
          echo "Embedded executables checked: $COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "Bundle ID: $BUNDLE_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Note: this archive is unsigned; Appflow must still export and sign its IPA." >> "$GITHUB_STEP_SUMMARY"
